
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TestVaani360_CloudAutoSync_v5_GitHubBuild.zip"
          test -f "$ZIP" || { echo "Project ZIP missing"; exit 1; }
          mkdir -p project
          unzip -q "$ZIP" -d project
          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find project -name settings.gradle -print -quit | xargs -r dirname)"
          fi
          test -n "$PROJECT_DIR" || { echo "Gradle project not found"; exit 1; }
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Firebase OTP callback
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("AccountManager.kt"))
          if not files:
              raise SystemExit("AccountManager.kt not found")

          for p in files:
              text = p.read_text()
              pattern = r'(override\s+fun\s+onVerificationFailed\s*\(\s*\w+\s*:\s*)[^)]+(\))'
              text, count = re.subn(pattern, r'\1FirebaseException\2', text)

              if count == 0 and not re.search(
                  r'onVerificationFailed\s*\(\s*\w+\s*:\s*FirebaseException', text
              ):
                  raise SystemExit(f"Could not patch callback in {p}")

              if "import com.google.firebase.FirebaseException" not in text:
                  lines = text.splitlines(True)
                  for i, line in enumerate(lines):
                      if line.startswith("package "):
                          lines.insert(i + 1, "import com.google.firebase.FirebaseException\n")
                          break
                  text = "".join(lines)

              p.write_text(text)
          PY

      - name: Configure AGP 9 compatibility
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          PROPS="gradle.properties"
          touch "$PROPS"

          for KEY in android.builtInKotlin android.newDsl; do
            if grep -q "^${KEY}=" "$PROPS"; then
              sed -i "s|^${KEY}=.*|${KEY}=false|" "$PROPS"
            else
              echo "${KEY}=false" >> "$PROPS"
            fi
          done

          echo "Applied AGP compatibility settings:"
          grep -E '^(android\.builtInKotlin|android\.newDsl)=' "$PROPS"

      - name: Show Gradle configuration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          find . -maxdepth 3 \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "gradle.properties" \) -print

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "APK not generated"; exit 1; }
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
