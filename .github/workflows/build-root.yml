
name: Build TestVaani 360 v57

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Locate Android project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "TestVaani360_Android/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=TestVaani360_Android" >> "$GITHUB_ENV"
          else
            echo "Android project not found"
            find . -name settings.gradle.kts
            exit 1
          fi

      - name: Verify project
        run: |
          echo "Project directory: $PROJECT_DIR"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          cat "$PROJECT_DIR/gradle.properties"

      - name: Build Debug APK
        run: |
          gradle -p "$PROJECT_DIR" \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v57-APK
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
