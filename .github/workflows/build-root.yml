name: Build TestVaani 360 APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project

          unzip -q TestVaani360_CloudAutoSync_v5_GitHubBuild.zip -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Kotlin configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          for p in Path(".").rglob("*.gradle.kts"):
              text = p.read_text()

              text = text.replace(
                  '    kotlinOptions { jvmTarget = "17" }\n',
                  '''    kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
              )

              p.write_text(text)

          print("Android Kotlin configuration fixed.")
          PY

      - name: Fix Firebase OTP callback
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/src/main/java/com/testvaani360/app/AccountManager.kt")

          if not p.exists():
              raise SystemExit(f"File not found: {p}")

          text = p.read_text()

          text = re.sub(
              r'onVerificationFailed\s*\(\s*exception\s*:\s*Exception\s*\)',
              'onVerificationFailed(exception: FirebaseException)',
              text
          )

          if 'import com.google.firebase.FirebaseException' not in text:
              lines = text.splitlines(True)

              insert_at = 0
              for i, line in enumerate(lines):
                  if line.startswith("package "):
                      insert_at = i + 1
                      break

              lines.insert(
                  insert_at,
                  'import com.google.firebase.FirebaseException\n'
              )

              text = ''.join(lines)

          p.write_text(text)

          print("Firebase OTP callback fixed.")
          PY

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
