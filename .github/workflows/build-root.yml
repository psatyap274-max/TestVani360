
name: Build TestVaani 360 v35 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-apk-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract v35 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v35_SpeedPractice_NOYES.zip"
          PROJECT="extracted/TestVaani360_Android"

          if [ ! -s "$ZIP" ]; then
            echo "::error::v35 ZIP repository root mein nahi mili."
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/app/src/main/assets/index.html"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::Android sdkmanager nahi mila."
            exit 1
          fi

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true

          "$MANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: extracted/TestVaani360_Android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="extracted/TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK nahi bani."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload v35 APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v35-debug-apk
          path: extracted/TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
