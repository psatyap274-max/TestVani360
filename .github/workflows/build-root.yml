name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract latest source ZIP
        run: |
          mkdir -p source
          unzip -q "TestVaani360_v57_language_questionbank_update.zip" -d source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          PROJECT_DIR="$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle settings file not found inside source ZIP."
            find source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $PROJECT_DIR"

      - name: Build Debug APK
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
          else
            gradle -p "$PROJECT_DIR" --no-daemon :app:assembleDebug
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
