
name: Build TestVaani 360 V56 Daily Streak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: testvaani360-v56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build and Upload V56 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project files
        shell: bash
        run: |
          set -euo pipefail
          test -f TestVaani360_Android/settings.gradle.kts
          test -f TestVaani360_Android/build.gradle.kts
          test -f TestVaani360_Android/app/build.gradle.kts
          test -f TestVaani360_Android/app/src/main/assets/index.html
          echo "Project files verified."

      - name: Build debug APK
        working-directory: TestVaani360_Android
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          find TestVaani360_Android/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk'
          test -n "$(find TestVaani360_Android/app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload V56 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-V56-DailyStreak-debug-APK
          path: TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
