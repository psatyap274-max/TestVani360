
  - name: Checkout source code
    uses: actions/checkout@v4

  - name: Detect Android project folder
    shell: bash
    run: |
      if [ -f "TestVaani360_Android/settings.gradle.kts" ]; then
        echo "PROJECT_DIR=TestVaani360_Android" >> "$GITHUB_ENV"
      elif [ -f "settings.gradle.kts" ]; then
        echo "PROJECT_DIR=." >> "$GITHUB_ENV"
      else
        echo "ERROR: Android project folder not found."
        find . -maxdepth 3 -name settings.gradle.kts -print
        exit 1
      fi

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Set up Gradle 8.13
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.13"

  - name: Check Android project files
    working-directory: ${{ env.PROJECT_DIR }}
    shell: bash
    run: |
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts
      echo "Android project files found."

  - name: Build Debug APK
    working-directory: ${{ env.PROJECT_DIR }}
    run: gradle --no-daemon clean assembleDebug

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: TestVaani360-debug-apk
      path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
