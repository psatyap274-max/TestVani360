
name: Build TestVaani 360 v37 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-v37-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract v37 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v37_Logo_ExamMock_Streak.zip"
          mkdir -p extracted

          if [ ! -s "$ZIP" ]; then
            echo "::error::v37 ZIP repository root mein nahi mili."
            exit 1
          fi

          unzip -t "$ZIP"
          unzip -q "$ZIP" -d extracted

          PROJECT="$(find extracted -type f -path '*/app/build.gradle.kts' \
            -print -quit | sed 's#/app/build.gradle.kts##')"

          if [ -z "$PROJECT" ]; then
            echo "::error::Android app/build.gradle.kts nahi mili."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::Android sdkmanager nahi mila."
            exit 1
          fi

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true
          "$MANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK generate nahi hui."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload v37 APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v37-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
