name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q TestVaani360_CloudAutoSync_v5_GitHubBuild.zip -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Android Kotlin configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(".")

          # Remove explicit Kotlin Android plugin declarations.
          for p in root.rglob("*.gradle.kts"):
              text = p.read_text()
              text = re.sub(
                  r'^\s*id\("org\.jetbrains\.kotlin\.android"\)(?:\s+version\s+"[^"]+")?(?:\s+apply\s+false)?\s*$',
                  '',
                  text,
                  flags=re.MULTILINE
              )
              p.write_text(text)

          app = Path("app/build.gradle.kts")
          text = app.read_text()

          # Replace old kotlinOptions with the Kotlin 2.x compilerOptions syntax.
          old = re.compile(
              r'\n\s*kotlinOptions\s*\{\s*jvmTarget\s*=\s*"17"\s*\}\s*',
              re.MULTILINE
          )

          new = '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''

          text, count = old.subn("\n" + new + "\n", text)

          if count == 0:
              raise SystemExit("Old kotlinOptions block was not found")

          app.write_text(text)

          print("Kotlin configuration fixed successfully.")
          print("Relevant app/build.gradle.kts section:")
          lines = app.read_text().splitlines()
          for i, line in enumerate(lines, 1):
              if "kotlin {" in line or "compilerOptions" in line or "jvmTarget" in line:
                  print(f"{i}: {line}")
          PY

      - name: Clean project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -rf .gradle build app/build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
