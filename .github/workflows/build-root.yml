
name: Build TestVaani 360 v32 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v32 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TestVaani360_v32_QuestionBank_Expansion.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install required Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Extract v32 project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q TestVaani360_v32_QuestionBank_Expansion.zip

          test -f TestVaani360_Android/settings.gradle.kts
          test -f TestVaani360_Android/app/build.gradle.kts
          test -f TestVaani360_Android/app/src/main/assets/index.html

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd TestVaani360_Android
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v32-debug-apk
          path: TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
