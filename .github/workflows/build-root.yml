name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Repository mein project ZIP nahi mili."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"
          echo "Extracted: $ZIP_FILE"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find "$RUNNER_TEMP/android-project" -type f -name 'settings.gradle*' | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle ya settings.gradle.kts nahi mili."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app module nahi mila: $PROJECT_DIR/app"
            exit 1
          fi

          echo "Building project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

          APK_PATH="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: Build ke baad debug APK nahi mili."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          cp "$APK_PATH" "$GITHUB_WORKSPACE/TestVaani-360-debug.apk"
          echo "APK ready: $GITHUB_WORKSPACE/TestVaani-360-debug.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani-360-debug-apk
          path: TestVaani-360-debug.apk
          if-no-files-found: error
          retention-days: 14
