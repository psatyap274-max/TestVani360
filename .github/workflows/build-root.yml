
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_v38_OK_YES_NO_Labels.zip'
      - '.github/workflows/build-root.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          wget -q https://services.gradle.org/distributions/gradle-9.5.1-bin.zip -O /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.5.1/bin" >> "$GITHUB_PATH"

      - name: Extract v38 project
        run: |
          test -f TestVaani360_v38_OK_YES_NO_Labels.zip
          unzip -q TestVaani360_v38_OK_YES_NO_Labels.zip -d "$RUNNER_TEMP/project"
          PROJECT_DIR="$(find "$RUNNER_TEMP/project" -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$(dirname "$PROJECT_DIR")" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v38-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
