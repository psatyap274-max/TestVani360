name: Build TestVaani 360 V55 V2 APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
name: Build V55 V2 Debug APK
runs-on: ubuntu-latest

steps:
  - name: Checkout V55 V2 source
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: "17"
      cache: gradle

  - name: Set up Gradle 8.13
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: "8.13"

  - name: Verify V55 V2 project
    working-directory: TestVaani360_Android
    shell: bash
    run: |
      test -f settings.gradle.kts
      test -f build.gradle.kts
      test -f app/build.gradle.kts
      test -f gradle/wrapper/gradle-wrapper.properties
      grep -q 'gradle-8.13-bin.zip' gradle/wrapper/gradle-wrapper.properties
      echo "V55 V2 project checks passed."

  - name: Build Debug APK
    working-directory: TestVaani360_Android
    run: gradle --no-daemon clean assembleDebug

  - name: Upload V55 V2 APK
    uses: actions/upload-artifact@v4
    with:
      name: TestVaani360-V55-V2-debug-APK
      path: TestVaani360_Android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
