
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check new ZIP
        run: |
          ZIP_FILE="TestVaani360_v21_AllFixes_GitHubUpload2.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP not found: $ZIP_FILE"
            echo "Make sure the ZIP is uploaded in the repository root."
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q \
            TestVaani360_v21_AllFixes_GitHubUpload2.zip \
            -d extracted

          if [ ! -f "extracted/TestVaani360_Android/settings.gradle.kts" ]; then
            echo "::error::Android project not found inside ZIP"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" \
                     "build-tools;36.0.0"
          yes | sdkmanager --licenses

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: extracted/TestVaani360_Android
        run: |
          gradle --no-daemon --stacktrace \
            :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v21-debug-apk
          path: extracted/TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
