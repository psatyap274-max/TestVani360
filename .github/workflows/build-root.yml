
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project or extract v37 ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted

          ZIP="$(find . -maxdepth 3 -type f \
            -name 'TestVaani360_v37_Logo_ExamMock_Streak.zip' \
            -print -quit)"

          if [ -n "$ZIP" ]; then
            unzip -t "$ZIP"
            unzip -q "$ZIP" -d extracted
            ROOT="extracted"
          else
            echo "v37 ZIP not found; checking repository for Android project."
            ROOT="."
          fi

          PROJECT="$(find "$ROOT" -type f \
            -path '*/app/build.gradle.kts' \
            -not -path '*/.gradle/*' \
            -print -quit | sed 's#/app/build.gradle.kts##')"

          if [ -z "$PROJECT" ]; then
            PROJECT="$(find "$ROOT" -type f \
              -path '*/app/build.gradle' \
              -not -path '*/.gradle/*' \
              -print -quit | sed 's#/app/build.gradle##')"
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::Android project nahi mila. Source ZIP ya project files repository mein upload karein."
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace :app:assembleDebug
          else
            echo "::error::Project mein gradlew wrapper nahi mila."
            exit 1
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK generate nahi hui."
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
