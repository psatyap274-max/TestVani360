
name: Build TestVaani 360 v37 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v37 and locate Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v37_Logo_ExamMock_Streak-1.zip"

          if [ ! -s "$ZIP" ]; then
            echo "::error::ZIP not found: $ZIP"
            find . -maxdepth 3 -type f -iname '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle file ZIP mein nahi mili."
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Android app module nahi mila."
            find "$PROJECT" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"
          ls -la "$PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f \
            -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::sdkmanager nahi mila."
            exit 1
          fi

          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true
          "$MANAGER" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK generate nahi hui."
            find "$PROJECT/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v37-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
