
name: Build TestVaani 360 v57

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          PROJECT_DIR=""

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "TestVaani360_Android/settings.gradle.kts" ] && [ -f "TestVaani360_Android/app/build.gradle.kts" ]; then
            PROJECT_DIR="TestVaani360_Android"
          else
            echo "Android project not found"
            find . -name settings.gradle.kts
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          gradle \
            -p "${{ steps.locate.outputs.project_dir }}" \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v57-APK
          path: ${{ steps.locate.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
