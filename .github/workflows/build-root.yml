
name: Build TestVaani 360 v54 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-root.yml"
      - "TestVaani360_v54_ClickRecovery_Source.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8"

      - name: Verify v54 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TestVaani360_v54_ClickRecovery_Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: v54 ZIP repository root mein nahi mili."
            echo "GitHub root mein exact filename check karein."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/testvaani-v54"
          unzip -q "TestVaani360_v54_ClickRecovery_Source.zip" \
            -d "$RUNNER_TEMP/testvaani-v54"

          PROJECT_DIR="$(find "$RUNNER_TEMP/testvaani-v54" \
            -type f -name settings.gradle.kts \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project ya app/build.gradle.kts nahi mila."
            find "$RUNNER_TEMP/testvaani-v54" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v54-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
