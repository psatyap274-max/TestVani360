
name: Build TestVaani 360 v57 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify project files
        run: |
          test -f "TestVaani360_Android/settings.gradle.kts"
          test -f "TestVaani360_Android/app/build.gradle.kts"

      - name: Build debug APK
        run: |
          gradle -p TestVaani360_Android \
            --no-daemon \
            :app:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v57-debug-apk
          path: TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
