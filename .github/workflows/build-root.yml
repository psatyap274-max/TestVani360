
name: Build TestVaani 360 v37 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract exact v37 ZIP and locate project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v37_Logo_ExamMock_Streak-1.zip"

          if [ ! -s "$ZIP" ]; then
            echo "::error::v37 ZIP repository root mein nahi mili: $ZIP"
            find . -maxdepth 2 -type f -name '*.zip' -print
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          WRAPPER="$(find extracted -type f -name gradlew \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$WRAPPER" ]; then
            echo "::error::ZIP mein Gradle wrapper (gradlew) nahi mila."
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi

          PROJECT="$(dirname "$WRAPPER")"

          if [ ! -f "$PROJECT/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT/app/build.gradle" ]; then
            echo "::error::Gradle wrapper mila, lekin app module nahi mila."
            find "$PROJECT" -maxdepth 4 -type f | head -100
            exit 1
          fi

          chmod +x "$WRAPPER"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build APK with project Gradle wrapper
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::Build ke baad APK nahi mili."
            find "$PROJECT/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v37-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
