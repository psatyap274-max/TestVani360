
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Locate project and build APK
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "settings.gradle.kts" ] && [ -f "app/build.gradle.kts" ]; then
            PROJECT_DIR="."
          elif [ -f "TestVaani360_Android/settings.gradle.kts" ] && [ -f "TestVaani360_Android/app/build.gradle.kts" ]; then
            PROJECT_DIR="TestVaani360_Android"
          else
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*v48*.zip' -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: Android project or v48 ZIP not found."
              exit 1
            fi

            mkdir -p extracted
            unzip -o "$ZIP_FILE" -d extracted

            SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle.kts missing in ZIP."
              exit 1
            fi

            PROJECT_DIR="${SETTINGS_FILE%/settings.gradle.kts}"

            if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
              echo "ERROR: app/build.gradle.kts missing."
              exit 1
            fi
          fi

          echo "Using Android project: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v48-debug-apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
