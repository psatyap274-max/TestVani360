name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP nahi mili."
            exit 1
          fi
          echo "Extracting: $ZIP_FILE"
          mkdir -p "$RUNNER_TEMP/android-project"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/android-project"

      - name: Locate Gradle wrapper and build APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="$(dirname "$(find "$RUNNER_TEMP/android-project" -type f -name gradlew | head -n 1)")"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "ERROR: Extracted ZIP ke andar gradlew nahi mila."
            echo "ZIP ke andar files:"
            find "$RUNNER_TEMP/android-project" -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          echo "Gradle project: $PROJECT_DIR"
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani-360-debug-apk
          path: |
            ${{ runner.temp }}/android-project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
