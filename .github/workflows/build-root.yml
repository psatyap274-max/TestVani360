
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_CloudAutoSync_v5_GitHubBuild.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Android project ZIP not found: $ZIP"
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find project -name settings.gradle -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle Android project not found in ZIP."
            find project -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fix Firebase OTP callback
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          files = list(Path(".").rglob("AccountManager.kt"))

          if not files:
              raise SystemExit("ERROR: AccountManager.kt not found")

          for p in files:
              text = p.read_text()

              pattern = (
                  r'(override\s+fun\s+onVerificationFailed'
                  r'\s*\(\s*\w+\s*:\s*)[^)]+(\))'
              )

              text, count = re.subn(
                  pattern,
                  r'\1FirebaseException\2',
                  text
              )

              if count == 0:
                  already_fixed = re.search(
                      r'onVerificationFailed\s*\(\s*\w+\s*:\s*FirebaseException',
                      text
                  )

                  if not already_fixed:
                      raise SystemExit(
                          f"ERROR: Could not patch callback in {p}"
                      )

              if "import com.google.firebase.FirebaseException" not in text:
                  lines = text.splitlines(True)
                  inserted = False

                  for i, line in enumerate(lines):
                      if line.startswith("package "):
                          lines.insert(
                              i + 1,
                              "import com.google.firebase.FirebaseException\n"
                          )
                          inserted = True
                          break

                  if not inserted:
                      lines.insert(
                          0,
                          "import com.google.firebase.FirebaseException\n"
                      )

                  text = "".join(lines)

              p.write_text(text)
              print(f"Firebase callback checked: {p}")

          print("Firebase callback patch completed.")
          PY

      - name: Show project configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "===== Gradle files ====="
          find . -maxdepth 3 \
            \( -name "*.gradle" -o -name "*.gradle.kts" \) -print

          echo "===== Kotlin files ====="
          find app/src/main -name "*.kt" -print || true

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon :app:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
