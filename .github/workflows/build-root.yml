
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: testvaani360-apk-build
  cancel-in-progress: true

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract v30 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v30_PracticeSets_Icon_Blessing.zip"
          PROJECT="extracted/TestVaani360_Android"

          if [ ! -f "$ZIP" ]; then
            echo "::error::ZIP not found: $ZIP"
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ ! -f "$PROJECT/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found"
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi

          if [ ! -f "$PROJECT/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts not found"
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            exit 1
          fi

          yes | "$MANAGER" --licenses || true

          "$MANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: extracted/TestVaani360_Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v30-debug-apk
          path: extracted/TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
