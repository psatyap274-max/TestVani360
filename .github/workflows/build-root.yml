name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          sdkmanager --install "platform-tools"
          sdkmanager --install "platforms;android-36"
          sdkmanager --install "build-tools;36.0.0"

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p source
          unzip -q "TestVaani360_v57_language_questionbank_update.zip" -d source

      - name: Find Android project
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Gradle settings file was not found inside the source ZIP."
            find source -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Android project: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"

          if [ ! -f "$PROJECT_DIR/gradlew" ]; then
            echo "Gradle wrapper (gradlew) was not found in the project."
            find "$PROJECT_DIR" -maxdepth 3 -type f -name "gradle*" -print
            exit 1
          fi

          chmod +x "$PROJECT_DIR/gradlew"
          "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" --no-daemon :app:assembleDebug

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
