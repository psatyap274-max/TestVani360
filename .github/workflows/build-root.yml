
name: Build TestVaani 360 v32 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v32 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TestVaani360_v32_QuestionBank_Expansion.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::v32 ZIP repository root mein nahi mili: $ZIP"
            exit 1
          fi
          unzip -t "$ZIP"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract v32 project
        shell: bash
        run: |
          set -euo pipefail
          unzip -q TestVaani360_v32_QuestionBank_Expansion.zip
          test -f TestVaani360_Android/settings.gradle.kts
          test -f TestVaani360_Android/app/build.gradle.kts
          test -f TestVaani360_Android/app/src/main/assets/index.html

      - name: Check Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd TestVaani360_Android
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"

      - name: Upload v32 debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v32-debug-apk
          path: TestVaani360_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
