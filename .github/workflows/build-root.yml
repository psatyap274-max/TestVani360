
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify v40 ZIP
        run: |
          test -f TestVaani360_v40_AllInOne_Update.zip

      - name: Extract v40 source
        run: |
          unzip -q TestVaani360_v40_AllInOne_Update.zip
          test -f TestVaani360_Android/settings.gradle.kts
          test -f TestVaani360_Android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: TestVaani360_Android
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v40-debug-APK
          path: TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
