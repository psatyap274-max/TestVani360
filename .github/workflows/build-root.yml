name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir project
          unzip -q TestVaani360_CloudAutoSync_v5_GitHubBuild.zip -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle.kts not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found at: $PROJECT_DIR"

      - name: Fix Android Kotlin configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          app = Path("app/build.gradle.kts")
          root = Path("build.gradle.kts")

          text = app.read_text()

          text = text.replace(
              '    id("org.jetbrains.kotlin.android")\n',
              ''
          )

          app.write_text(text)

          root_text = root.read_text()

          root_text = root_text.replace(
              '    id("org.jetbrains.kotlin.android") version "2.2.10" apply false\n',
              ''
          )

          root.write_text(root_text)

          print("Kotlin plugin conflict removed.")
          print("APP PLUGINS:")
          print("\n".join(app.read_text().splitlines()[:8]))
          print("ROOT PLUGINS:")
          print(root.read_text())
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
