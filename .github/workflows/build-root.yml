
name: Build TestVaani 360 v54 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-root.yml"
      - "TestVaani360_v54_ClickRecovery_Source.zip"

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TestVaani360_v54_ClickRecovery_Source.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP repository root mein nahi mili."
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          EXTRACT_DIR="$RUNNER_TEMP/testvaani-v54"
          mkdir -p "$EXTRACT_DIR"

          unzip -q \
            "TestVaani360_v54_ClickRecovery_Source.zip" \
            -d "$EXTRACT_DIR"

          PROJECT_FILE="$(find "$EXTRACT_DIR" \
            -type f -name settings.gradle.kts -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: settings.gradle.kts nahi mili."
            find "$EXTRACT_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts nahi mili."
            find "$PROJECT_DIR" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --version
          gradle --no-daemon :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/debug"

          if ! find "$APK_DIR" -maxdepth 1 \
            -type f -name "*.apk" -print -quit | grep -q .; then
            echo "ERROR: Debug APK generate nahi hui."
            exit 1
          fi

          ls -lh "$APK_DIR"/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v54-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
