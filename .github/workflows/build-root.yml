
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check and extract ZIP
        run: |
          ZIP="TestVaani360_v22_KotlinFix_GitHub.zip"
          test -f "$ZIP" || {
            echo "::error::New v22 ZIP not found"
            exit 1
          }
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          test -f extracted/TestVaani360_Android/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          SDK="$ANDROID_HOME"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$MANAGER" --licenses || true
          "$MANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK
        working-directory: extracted/TestVaani360_Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v22-debug-apk
          path: extracted/TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
