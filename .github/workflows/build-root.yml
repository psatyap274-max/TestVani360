
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify and extract v25 ZIP
        run: |
          ZIP="TestVaani360_v25_ProfileResultFinalFix.zip"

          if [ ! -f "$ZIP" ]; then
            echo "::error::v25 ZIP not found in repository root"
            exit 1
          fi

          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          if [ ! -f "extracted/TestVaani360_Android/settings.gradle.kts" ]; then
            echo "::error::Android project settings.gradle.kts not found"
            find extracted -maxdepth 4 -type f | head -80
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$MANAGER" ]; then
            echo "::error::Android sdkmanager not found"
            find "$SDK" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -20
            exit 1
          fi

          yes | "$MANAGER" --licenses || true
          "$MANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: extracted/TestVaani360_Android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v25-debug-apk
          path: extracted/TestVaani360_Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
