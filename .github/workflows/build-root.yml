name: Build TestVaani 360 APK

on:
workflow_dispatch:
push:
branches: [ main ]

permissions:
contents: read

jobs:
build-debug-apk:
runs-on: ubuntu-latest

defaults:
  run:
    working-directory: TestVaani360_Android

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build debug APK
    run: |
      gradle --no-daemon :app:assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: TestVaani360-v48-debug-apk
      path: TestVaani360_Android/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
