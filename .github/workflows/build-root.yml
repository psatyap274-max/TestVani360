
name: Build TestVaani 360 V56 Daily Streak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: testvaani360-v56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build V56 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V56 ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -oq TestVaani360_v56_DailyStreak_Update.zip -d extracted

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail
          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts -o \
               -name settings.gradle \) \
            -not -path '*/.gradle/*' -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project located: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace assembleDebug
          else
            gradle --no-daemon --stacktrace assembleDebug
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK file not generated."
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-V56-DailyStreak-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
