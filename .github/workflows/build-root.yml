name: Build TestVaani 360 v53 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-root.yml"
      - "TestVaani360_v53_IconSafeMargin_SourceAudit.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Extract v53 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="TestVaani360_v53_IconSafeMargin_SourceAudit.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: $ZIP_FILE repository root mein nahi mili."
            echo "Pehle latest v53 ZIP ko repository mein upload karein."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/testvaani-source"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/testvaani-source"

          PROJECT_DIR="$(find "$RUNNER_TEMP/testvaani-source" \
            -type f -name settings.gradle.kts \
            -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: Android project ya app/build.gradle.kts nahi mila."
            find "$RUNNER_TEMP/testvaani-source" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v53-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
