name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'TestVaani360_CloudAutoSync_v5_GitHubBuild.zip'
      - '.github/workflows/build-root.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf project
          mkdir project
          unzip -q TestVaani360_CloudAutoSync_v5_GitHubBuild.zip -d project

          PROJECT_DIR="$(find project -name settings.gradle.kts -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Remove duplicate Kotlin Android plugin
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          for p in root.rglob("*.gradle.kts"):
              text = p.read_text()

              lines = text.splitlines(True)

              new_lines = []
              for line in lines:
                  if "org.jetbrains.kotlin.android" in line:
                      continue
                  new_lines.append(line)

              p.write_text("".join(new_lines))

          print("Kotlin Android plugin declarations removed from Gradle files.")

          print("Remaining Kotlin plugin references:")
          found = False

          for p in root.rglob("*.gradle.kts"):
              for i, line in enumerate(p.read_text().splitlines(), 1):
                  if "org.jetbrains.kotlin.android" in line:
                      print(f"{p}:{i}: {line}")
                      found = True

          if found:
              raise SystemExit("Kotlin Android plugin reference still exists")
          PY

      - name: Clean old Gradle files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 'current'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-apk
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
