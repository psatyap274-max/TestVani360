
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '*.zip'
      - '.github/workflows/build-root.yml'

permissions:
  contents: read

concurrency:
  group: testvaani360-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v38 project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TestVaani360_v38_OK_YES_NO_Labels-1.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted
          SETTINGS="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print -quit)"
          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file missing"
            find extracted -maxdepth 5 -type f | head -150
            exit 1
          fi
          PROJECT="$(dirname "$SETTINGS")"
          test -f "$PROJECT/app/build.gradle.kts" -o -f "$PROJECT/app/build.gradle"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"
          ls -la "$PROJECT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$MANAGER" ]; then
            echo "::error::Android sdkmanager missing"
            exit 1
          fi
          yes | "$MANAGER" --sdk_root="$SDK" --licenses || true
          "$MANAGER" --sdk_root="$SDK" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT"
          gradle --version
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "::error::APK generate nahi hui"
            find "$PROJECT" -type f -name '*.apk' -print
            exit 1
          fi
          mkdir -p final-apk
          cp "$APK" final-apk/TestVaani360-debug.apk
          ls -lh final-apk/TestVaani360-debug.apk
          sha256sum final-apk/TestVaani360-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-APK
          path: final-apk/TestVaani360-debug.apk
          if-no-files-found: error
          retention-days: 14
