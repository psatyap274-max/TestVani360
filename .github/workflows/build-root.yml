
name: Build TestVaani 360 V56 Daily Streak APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: testvaani360-v56-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build V56 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V56 source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="TestVaani360_v56_DailyStreak_Update.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: V56 ZIP not found in repository root."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS="$(find extracted -type f \
            \( -name settings.gradle.kts \
               -o -name settings.gradle \) \
            -not -path '*/.gradle/*' \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project settings file not found."
            find extracted -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] \
            && [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: Android app build file not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Build Android debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --version
          gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."
            exit 1
          fi

          echo "APK generated successfully:"
          ls -lh "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-V56-DailyStreak-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
