
name: Build TestVaani 360 v37 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v37 ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP="TestVaani360_v37_Logo_ExamMock_Streak-1.zip"
          test -s "$ZIP"
          unzip -t "$ZIP"
          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          PROJECT="extracted/TestVaani360_Android"
          test -f "$PROJECT/settings.gradle.kts"
          test -f "$PROJECT/app/build.gradle.kts"
          test -f "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          VERSION="$(sed -n 's/.*gradle-\([0-9][0-9.]*\)-bin.zip.*/\1/p' \
            "$PROJECT/gradle/wrapper/gradle-wrapper.properties" | head -1)"

          if [ -z "$VERSION" ]; then
            echo "::error::Gradle version properties file se nahi mili."
            cat "$PROJECT/gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          echo "GRADLE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Gradle version: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager \
            2>/dev/null | sort -V | tail -n 1)"

          if [ -n "$MANAGER" ]; then
            yes | "$MANAGER" --sdk_root="$SDK" --licenses || true
            "$MANAGER" --sdk_root="$SDK" --install \
              "platform-tools" \
              "platforms;android-36" \
              "build-tools;36.0.0"
          fi

      - name: Build debug APK
        working-directory: ${{ env.PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-v37-debug-apk
          path: ${{ env.PROJECT }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
