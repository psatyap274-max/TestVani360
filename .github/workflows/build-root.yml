
name: Build TestVaani 360 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-root.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Find and extract v38 ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="TestVaani360_v38_OK_YES_NO_Labels-1.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="TestVaani360_v38_OK_YES_NO_Labels.zip"
          fi

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: v38 ZIP nahi mili."
            find . -maxdepth 2 -type f -name '*.zip'
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/tv-project"
          unzip -t "$ZIP_FILE"
          unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/tv-project"

          echo "ZIP CONTENTS:"
          find "$RUNNER_TEMP/tv-project" -maxdepth 5 -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts -o \
               -name build.gradle -o \
               -name build.gradle.kts -o \
               -name gradlew \) -print

          SETTINGS="$(find "$RUNNER_TEMP/tv-project" -type f \
            \( -name settings.gradle -o \
               -name settings.gradle.kts \) -print -quit)"

          if [ -n "$SETTINGS" ]; then
            PROJECT="$(dirname "$SETTINGS")"
          else
            WRAPPER="$(find "$RUNNER_TEMP/tv-project" -type f \
              -name gradlew -print -quit)"

            if [ -n "$WRAPPER" ]; then
              PROJECT="$(dirname "$WRAPPER")"
            else
              APP_BUILD="$(find "$RUNNER_TEMP/tv-project" -type f \
                \( -path '*/app/build.gradle' -o \
                   -path '*/app/build.gradle.kts' \) -print -quit)"

              if [ -z "$APP_BUILD" ]; then
                echo "ERROR: ZIP mein Android Gradle project nahi mila."
                find "$RUNNER_TEMP/tv-project" -maxdepth 6 -type f \
                  | head -150
                exit 1
              fi

              echo "ERROR: app module mila lekin settings.gradle aur gradlew nahi mile."
              echo "Original ZIP structure verify karna zaroori hai."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT"
          ls -la "$PROJECT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            echo "ERROR: Gradle Wrapper missing."
            exit 1
          fi

      - name: Find and verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            ! -name '*androidTest*' -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: Build ke baad APK nahi mili."
            find "$PROJECT_DIR" -type f -name '*.apk' -print
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/final-apk"
          cp "$APK" "$RUNNER_TEMP/final-apk/TestVaani360-debug.apk"
          echo "APK_PATH=$RUNNER_TEMP/final-apk/TestVaani360-debug.apk" \
            >> "$GITHUB_ENV"

          ls -lh "$RUNNER_TEMP/final-apk/TestVaani360-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TestVaani360-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 7
